services:
  - type: web
    name: sweetvtu-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VTPASS_SANDBOX
        value: "1"
      - key: FRONTEND_ORIGIN
        value: https://engrmahmod.github.io
